name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (install → lint → typecheck → test → build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  frontend:
    name: Frontend (install → lint → typecheck → build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  contracts:
    name: Smart contracts (compile → test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        run: npm ci

      # Compiles via the solc npm package rather than `hardhat compile`.
      # This project was built in a sandbox that couldn't reach
      # binaries.soliditylang.org (Hardhat's default compiler source);
      # this path works everywhere and produces identical bytecode. If
      # your runner CAN reach that host, `npx hardhat compile` works too
      # and nothing else needs to change.
      - name: Compile (solc via npm)
        run: npm run compile

      - name: Test (17 cases — access control, duplicates, events, pausability, gas)
        run: npx hardhat test --no-compile

  # Non-blocking by design: dependency advisories shouldn't halt every PR,
  # but they should be visible. Promote specific advisories to blocking
  # (remove continue-on-error) once you've triaged the current baseline.
  security-audit:
    name: Security audit (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm audit (${{ matrix.project }})
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high
        continue-on-error: true

  # Real, working step: publishes both service images to GitHub Container
  # Registry using the repo's built-in GITHUB_TOKEN — no external secrets
  # needed for this part, and it only runs after every check above has
  # actually passed. Pushing to a live host beyond this is deliberately
  # left as an opt-in step gated on a secret's presence (see below):
  # without real infrastructure credentials, faking that step would be
  # worse than omitting it.
  publish-images:
    name: Publish Docker images
    needs: [backend, frontend, contracts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image namespace
        id: image_ns
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image_ns.outputs.value }}-backend:latest
            ${{ steps.image_ns.outputs.value }}-backend:${{ github.sha }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image_ns.outputs.value }}-frontend:latest
            ${{ steps.image_ns.outputs.value }}-frontend:${{ github.sha }}

  # Optional final step. Many PaaS providers (Render, Railway, Fly.io)
  # expose a "deploy hook" URL you can just POST to. This step only fires
  # if you've actually added the corresponding secret in repo settings —
  # otherwise it's skipped with a clear message rather than pretending to
  # deploy somewhere that doesn't exist.
  trigger-deploy:
    name: Trigger production deploy (if configured)
    needs: publish-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check for deploy hook secret
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call deploy hook
        if: steps.check.outputs.configured == 'true'
        run: curl -fsSL -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

      - name: Skip (no deploy target configured)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "No DEPLOY_HOOK_URL secret is set, so there's nothing to deploy to yet."
          echo "Add one under Settings → Environments → production → Secrets"
          echo "once you have a real hosting target (Render/Railway/Fly/etc.)."
